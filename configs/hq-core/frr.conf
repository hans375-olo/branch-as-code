frr version 10.2
frr defaults traditional
hostname hq-core
log stdout
service integrated-vtysh-config
!
interface lo
 description HQ loopback
 ip address 10.255.255.1/32
!
interface eth1
 description WAN to rtr1-edge (store 001)
 ip address 100.64.1.0/31
!
! HQ services summary announced to branches
ip route 172.16.0.0/24 blackhole
!
router bgp 65000
 bgp router-id 10.255.255.1
 no bgp ebgp-requires-policy
 neighbor 100.64.1.1 remote-as 65001
 neighbor 100.64.1.1 description store-001-edge
 address-family ipv4 unicast
  network 172.16.0.0/24
  network 10.255.255.1/32
 exit-address-family
!
