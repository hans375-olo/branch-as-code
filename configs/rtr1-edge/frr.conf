! ============================================================
! Golden config: rtr1-edge (wan-edge / frr)
! Rendered by branch-as-code from static-yaml
! Routing policy (BGP/ASN/statics) comes from group_vars — the SoT
! owns topology and IPAM, vars own routing design.
! ============================================================
frr version 10.2
frr defaults traditional
hostname rtr1-edge
log stdout
service integrated-vtysh-config
!
interface lo
 description Loopback / router-id
 ip address 10.255.1.1/32
!
interface eth1
 description WAN to hq-core
 ip address 100.64.1.1/31
!
interface eth2
 description Routed handoff to sw1
 ip address 10.1.255.1/31
!
ip route 10.1.0.0/20 10.1.255.0
!
router bgp 65001
 bgp router-id 10.255.1.1
 no bgp ebgp-requires-policy
 neighbor 100.64.1.0 remote-as 65000
 neighbor 100.64.1.0 description hq-core
 address-family ipv4 unicast
  redistribute static
 exit-address-family
!
