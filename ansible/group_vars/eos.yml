# Arista EOS devices: reachable over eAPI (enabled in golden config)
# on the containerlab management network.
ansible_connection: ansible.netcommon.httpapi
ansible_network_os: arista.eos.eos
ansible_httpapi_use_ssl: false
ansible_httpapi_port: 80
ansible_user: admin
ansible_password: admin        # cEOS-lab default; set a real one if your image requires it
real estate: Ansible Vault