# Static fallback SoT — the pipeline works with ZERO infrastructure.
# Templates consume the same variable contract whether the data came
# from these YAML files or from the NetBox API.
all:
  children:
    # --- role groups (mirror NetBox device-role slugs) ---
    wan-edge:
      hosts:
        rtr1-edge:
          ansible_host: clab-branch-001-rtr1-edge
    dist-switch:
      hosts:
        sw1:
          ansible_host: clab-branch-001-sw1
    access-switch:
      hosts:
        sw2:
          ansible_host: clab-branch-001-sw2
    # --- unmanaged provider side: never rendered or deployed, but verified ---
    provider:
      hosts:
        hq-core:
    # --- platform groups (mirror NetBox platform slugs) ---
    eos:
      hosts:
        sw1:
        sw2:
    frr:
      hosts:
        rtr1-edge:
        hq-core: