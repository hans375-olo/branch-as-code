[defaults]
# Default to the static SoT so the pipeline runs without NetBox.
# Use the real thing with:  ansible-playbook -i inventories/netbox.yml ...
inventory = inventories/static/hosts.yml
host_key_checking = False
retry_files_enabled = False
stdout_callback = ansible.builtin.default
result_format = yaml
interpreter_python = auto_silent
timeout = 30

[inventory]
enable_plugins = netbox.netbox.nb_inventory, yaml, ini
