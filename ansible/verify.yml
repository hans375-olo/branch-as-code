---
# Post-change verification — the "prove it works" step.
#
#   ansible-playbook verify.yml

- name: Verify switching state on EOS devices
  hosts: eos
  gather_facts: false
  tasks:
    - name: Collect operational state
      arista.eos.eos_command:
        commands:
          - show vlan brief
          - show ip interface brief
          - show lldp neighbors
      register: show

    - name: Operational state
      ansible.builtin.debug:
        msg: "{{ show.stdout }}"


- name: Verify BGP session to HQ on the store edge
  hosts: wan-edge
  gather_facts: false
  tasks:
    - name: BGP summary (structured)
      delegate_to: localhost
      ansible.builtin.command: >-
        docker exec clab-branch-001-{{ inventory_hostname }}
        vtysh -c "show ip bgp summary json"
      register: bgp_raw

    - name: Parse BGP state
      ansible.builtin.set_fact:
        bgp: "{{ bgp_raw.stdout | from_json }}"

    - name: Assert session to HQ is Established
      ansible.builtin.assert:
        that:
          - bgp.ipv4Unicast.peers['100.64.1.0'].state == 'Established'
        fail_msg: "BGP session to HQ is NOT established — check WAN link and ASNs"
        success_msg: "eBGP to HQ established, router-id {{ bgp.ipv4Unicast.routerId }}"

- name: Verify the provider side (hq-core — unmanaged, but verified)
  hosts: provider
  gather_facts: false
  tasks:
    - name: BGP summary (structured)
      delegate_to: localhost
      ansible.builtin.command: >-
        docker exec clab-branch-001-hq-core
        vtysh -c "show ip bgp summary json"
      register: bgp_raw

    - name: Parse BGP state
      ansible.builtin.set_fact:
        bgp: "{{ bgp_raw.stdout | from_json }}"

    - name: Assert provider sees the store
      ansible.builtin.assert:
        that:
          - bgp.ipv4Unicast.peers['100.64.1.1'].state == 'Established'
        fail_msg: "HQ side of the eBGP session is NOT established"
        success_msg: "HQ side established — both ends of the session confirmed"

- name: End-to-end connectivity
  hosts: localhost
  gather_facts: false
  tasks:
    - name: guest -> staff (inter-VLAN routing via sw1)
      ansible.builtin.command: >-
        docker exec clab-branch-001-host-guest ping -c 2 -W 1 10.1.1.10
      changed_when: false

    - name: "pos -> HQ loopback (full path: access -> dist -> edge -> BGP -> HQ)"
      ansible.builtin.command: >-
        docker exec clab-branch-001-host-pos ping -c 2 -W 1 10.255.255.1
      changed_when: false
